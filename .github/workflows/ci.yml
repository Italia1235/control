name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Build plugin and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # .mvn/maven.config points Maven at .mvn/settings.xml (Maven Central, Atlassian public, Jenkins releases).
      - name: Build and run unit tests
        run: mvn -B -ntp clean package
      - name: Check the packaged JAR
        id: packaged
        run: |
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'control-*.jar' ! -name '*-tests.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one plugin JAR, found ${#jars[@]}"
            exit 1
          fi
          jar="${jars[0]}"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          mvn -B -ntp -o -q test -Dtest=PluginPackagingTest -Dcontrol.packagedJar="$jar"
      - uses: actions/upload-artifact@v4
        with:
          name: control-jar
          path: ${{ steps.packaged.outputs.jar }}
          if-no-files-found: error

  evals:
    name: Free evals (no LLM, no Jira)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:offline
      - run: npm run test:live-helpers
